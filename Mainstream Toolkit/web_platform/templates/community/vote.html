<div class="vote-control">{% if user.is_authenticated and user.id != post.author.user_id %}<form method="post" action="{% url 'vote' post.id %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button class="quiet vote-button" name="action" value="{% if post.has_upvoted %}remove{% else %}upvote{% endif %}" aria-pressed="{{ post.has_upvoted|yesno:'true,false' }}" aria-label="{% if post.has_upvoted %}Remove upvote for{% else %}Upvote{% endif %} {{ post.title }}">▲ {{ post.vote_count }} · {% if post.has_upvoted %}Liked{% else %}Like{% endif %}</button></form>{% elif user.is_authenticated %}<span>▲ {{ post.vote_count }} reader like{{ post.vote_count|pluralize }}</span>{% else %}<a href="{% url 'login' %}?next={{ request.get_full_path|urlencode }}">▲ {{ post.vote_count }} · Sign in to like</a>{% endif %}</div>
