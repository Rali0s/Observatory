{% if share_url %}<div class="social-share" role="group" aria-label="Share {{ share_title }}"><span class="share-caption">Share</span>
{% for platform, label, destination in share_links %}<a href="{{ destination }}" target="_blank" rel="noopener noreferrer" aria-label="Share on {{ label }}" title="Share on {{ label }}"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true" focusable="false">{% if platform == 'x' %}<path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3L12 14.6 5.5 22H2.3l8.2-9.4L.8 2h6.5l4.5 6.8L18.9 2ZM17.9 20h1.7L6.3 3.9H4.5L17.9 20Z"/>{% elif platform == 'facebook' %}<path d="M14 22v-9h3l.5-4H14V7c0-1.2.4-2 2-2h2V1.4c-.4-.1-1.8-.2-3.3-.2-3.3 0-5.2 2-5.2 5.5V9H6v4h3.5v9H14Z"/>{% elif platform == 'blogger' %}<path d="M7 2a5 5 0 0 0-5 5v10a5 5 0 0 0 5 5h10a5 5 0 0 0 5-5v-6h-3c-1 0-1-1-1-2V7a5 5 0 0 0-5-5H7Zm1 5h5a1.5 1.5 0 0 1 0 3H8a1.5 1.5 0 0 1 0-3Zm0 7h8a1.5 1.5 0 0 1 0 3H8a1.5 1.5 0 0 1 0-3Z"/>{% else %}<path d="M3 8h4v14H3V8Zm2-6a2.3 2.3 0 1 1 0 4.6A2.3 2.3 0 0 1 5 2Zm5 6h4v2c1-1.6 2.3-2.4 4-2.4 3.3 0 4 2.1 4 5.4v9h-4v-8c0-2-.4-3-1.8-3-1.7 0-2.2 1.3-2.2 3v8h-4V8Z"/>{% endif %}</svg><span>{{ label }}</span></a>{% endfor %}
<button type="button" class="quiet" data-copy-share="{{ share_url }}" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 8V3H3v13h5"/></svg>Copy link</button><button type="button" class="quiet" data-native-share="{{ share_url }}" data-share-title="{{ share_title }}" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 16V2m-5 5 5-5 5 5M4 12v9h16v-9"/></svg>More</button><span class="share-status small" role="status" aria-live="polite"></span></div>{% endif %}
